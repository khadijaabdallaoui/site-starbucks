<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="CC.css">  
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Contact</title>
</head>
<body>
    <section class="review" id="review">
        <div class="contact-box">
            <div class="contact-body">
                <form>
                <h2>Contact Us</h2>
                <div class="form-content">
                <input type="text" required>
                <span></span>
                <label>Username</label>
                </div>
                <div class="form-content">
                <input type="email" required>
                <span></span>
                <label>Email</label>
                </div>
                <button class="btn">Send</button>
                </div>
            </form>
            </div>
            <div class="footer">
            <div class="footer-box">
            <div class="social-media">
                    <a href="https://fr-fr.facebook.com/Starbucks/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                    <a href="https://www.instagram.com/starbucks/reels/?hl=fr" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://twitter.com/starbucks" target="_blank"><i class="fa-brands fa-twitter" ></i></a>
                    <a href="https://www.youtube.com/user/Starbucks" target="_blank"><i class="fa-brands fa-youtube"></i></a>
                </div>
    
    
                <div class="copyright">
                    <label> &copy; 2023 Starbucks coffee company . All rights reserved.</label>
                </div>
                <div class="brand">
                    <label>STAR<span>BUCKS</span></label>
                </div>
            </div>
        </div>
        </section>
        </div>
        </div>
        </div>
        </div>            
    </section>
</body>
</html>
